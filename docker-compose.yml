version: '3.8'

services:
  web:
    build: .
    container_name: rdm-app
    ports:
      - "8080:80"
    volumes:
      - ./application/config:/var/www/html/application/config
      - ./application/logs:/var/www/html/application/logs
      - ./application/cache:/var/www/html/application/cache
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - rdm-network
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: rdm-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rdm_database
      MYSQL_USER: rdm_user
      MYSQL_PASSWORD: rdm_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rdm-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rdm-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    networks:
      - rdm-network
    restart: unless-stopped
    depends_on:
      - db

networks:
  rdm-network:
    driver: bridge

volumes:
  db_data:
